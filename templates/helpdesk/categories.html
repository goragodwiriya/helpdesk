<form data-form="helpdeskCategories" action="api/helpdesk/categories/save" method="post" data-ajax-submit="true"
      data-load-api="api/helpdesk/categories/get" data-load-query-params="true"
      data-confirm="Confirm save" autocomplete="off">
  <div class="card-groups">
    <header>
      <div>
        <h1 class="icon-support" data-text="'{LNG_List of} ' + label" data-i18n></h1>
        <p data-i18n>{LNG_Helpdesk}</p>
      </div>
    </header>
    <div class="content-body">
      <fieldset class="grid">
        <div class="tablebody">
          <table class="table border fullwidth" data-table="helpdeskCategories" data-editable-rows="true"
                 data-attr="data:options" data-url-params="false">
            <!-- หัวคอลัมน์ชื่อเป็นชื่อชนิด และคอลัมน์สี (ชนิดที่มีสี) มาจาก options.columnGroups -->
            <thead>
              <tr>
                <th data-field="category_id" class="center" data-cell-class="center" data-cell-element="text" data-size="5" data-i18n>{LNG_ID}</th>
                <th data-column-group="topic" data-field="topic" data-cell-element="text" data-size="30">{label}</th>
                <th data-column-group="color" data-field="color" class="center" data-cell-class="center" data-cell-element="color" data-size="10" data-i18n>{LNG_Color}</th>
                <th data-field="is_active" class="center" data-cell-class="center" data-cell-element="switch" data-i18n>{LNG_Active}</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="comment" data-i18n>{LNG_ID is the value stored in the database. Changing it affects existing tickets.}</div>
      </fieldset>
      <fieldset class="submit">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
        <input type="hidden" name="type" data-attr="value:type">
      </fieldset>
    </div>
  </div>
</form>
