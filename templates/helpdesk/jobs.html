<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-customer" data-i18n>{LNG_Tickets} ({LNG_Agent})</h1>
      <p data-i18n>{LNG_List of} {LNG_Tickets} {LNG_that you are responsible for}</p>
    </div>
    <div>
      <a class="btn btn-info icon-download" href="api/helpdesk/jobs/export?type=csv" target="_blank" rel="noopener" data-i18n>{LNG_Export}</a>
      <a class="btn btn-primary icon-new" href="/helpdesk-receive?id=0" data-i18n>{LNG_Create ticket}</a>
    </div>
  </header>
  <div class="content-body">
    <div class="tablebody">
      <table class="table border fullwidth helpdesk-table" data-table="helpdeskJobs" data-source="api/helpdesk/jobs"
             data-default-sort="updated_at desc" data-page-size="25" data-search-columns="ticket_no,subject,customer" data-search-placeholder="{LNG_Search}..."
             data-show-checkbox="true" data-actions='{"delete":"Delete"}' data-action-url="api/helpdesk/jobs/action"
             data-row-actions='{
                "claim": {
                  "title": "Take this job",
                  "className": "btn btn-success icon-customer notext",
                  "confirm": "Do you want to take this job ?",
                  "condition": "agent_id == 0"
                },
                "reopen": {
                  "title": "Reopen Ticket",
                  "className": "btn btn-warning icon-refresh notext",
                  "confirm": "Do you want to reopen this ticket ?",
                  "condition": "is_closed == 1"
                },
                "delete": {
                  "title": "Delete",
                  "className": "btn btn-danger icon-delete notext",
                  "confirm": "You want to delete ?",
                  "condition": "can_manage == 1"
                }
              }'>
        <thead>
          <tr>
            <th data-field="created_at" data-filter="true" data-type="daterange" data-range-names="from,to" data-range-presets="today,7d,30d,thismonth,lastmonth" data-hidden="true" data-i18n>{LNG_Date}</th>
            <th data-field="category" data-filter="true" data-type="select" data-show-all="true" data-all-value="" data-hidden="true" data-i18n>{LNG_Category}</th>
            <th data-field="agent_id" data-filter="true" data-type="select" data-show-all="true" data-all-value="" data-hidden="true" data-i18n>{LNG_Assign to}</th>
            <th data-field="overdue" data-filter="true" data-type="select" data-show-all="true" data-all-value="" data-hidden="true" data-options='{"1":"{LNG_Overdue}"}' data-i18n>{LNG_Overdue}</th>
            <th data-field="priority" data-filter="true" data-type="select" data-show-all="true" data-all-value="" data-hidden="true" data-i18n>{LNG_Priority}</th>
            <th data-field="subject" data-sort="subject" data-formatter="formatHelpdeskSubject" data-i18n>{LNG_Ticket}</th>
            <th data-field="status" data-sort="status" class="right" data-cell-class="top right nowrap" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                data-formatter="formatHelpdeskStatus" data-i18n>{LNG_Status}</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
