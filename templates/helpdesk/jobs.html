<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-customer" data-i18n>{LNG_Tickets} ({LNG_Agent})</h1>
            <p data-i18n>{LNG_List of} {LNG_Tickets} {LNG_that you are responsible for}</p>
          </div>
          <div>
            <a class="btn btn-info icon-download" href="api/helpdesk/jobs/export?type=csv" target="_blank" rel="noopener" data-i18n>{LNG_Export}</a>
            <a class="btn btn-primary icon-new" href="/helpdesk-receive?id=0" data-i18n>{LNG_Create ticket}</a>
          </div>
        </header>
        <div class="content-body">
          <div class="tablebody">
            <form data-table-filter="helpdeskJobs" class="table_nav">
              <div>
                <label for="jobs_from" data-i18n>{LNG_from}</label>
                <span class="form-control">
                  <input type="date" id="jobs_from" name="from">
                </span>
              </div>
              <div>
                <label for="jobs_to" data-i18n>{LNG_to}</label>
                <span class="form-control">
                  <input type="date" id="jobs_to" name="to">
                </span>
              </div>
              <div>
                <label for="jobs_category" data-i18n>{LNG_Category}</label>
                <span class="form-control">
                  <select id="jobs_category" name="category">
                    <option value="" data-i18n>{LNG_all items}</option>
                  </select>
                </span>
              </div>
              <div>
                <label for="jobs_agent_id" data-i18n>{LNG_Assign to}</label>
                <span class="form-control">
                  <select id="jobs_agent_id" name="agent_id">
                    <option value="" data-i18n>{LNG_all items}</option>
                  </select>
                </span>
              </div>
              <div>
                <label for="jobs_priority" data-i18n>{LNG_Priority}</label>
                <span class="form-control">
                  <select id="jobs_priority" name="priority">
                    <option value="" data-i18n>{LNG_all items}</option>
                  </select>
                </span>
              </div>
              <div>
                <label for="jobs_status" data-i18n>{LNG_Status}</label>
                <span class="form-control">
                  <select id="jobs_status" name="status">
                    <option value="" data-i18n>{LNG_all items}</option>
                  </select>
                </span>
              </div>
              <div>
                <label for="jobs_overdue" data-i18n>{LNG_Overdue}</label>
                <span class="form-control">
                  <select id="jobs_overdue" name="overdue">
                    <option value="" data-i18n>{LNG_all items}</option>
                    <option value="1" data-i18n>{LNG_Overdue}</option>
                  </select>
                </span>
              </div>
              <input type="search" name="search" placeholder="{LNG_Search}...">
            </form>
            <table class="table border fullwidth helpdesk-table" data-table="helpdeskJobs" data-source="api/helpdesk/jobs"
                   data-default-sort="updated_at desc" data-page-size="30" data-search-columns="ticket_no,subject,customer"
                   data-show-checkbox="true" data-actions='{"delete":"Delete"}' data-action-url="api/helpdesk/jobs/action"
                   data-row-actions='{
                      "claim": {
                        "title": "Take this job",
                        "className": "btn btn-success icon-customer notext",
                        "confirm": "Do you want to take this job ?",
                        "condition": "agent_id == 0"
                      },
                      "reopen": {
                        "title": "Reopen Ticket",
                        "className": "btn btn-warning icon-refresh notext",
                        "confirm": "Do you want to reopen this ticket ?",
                        "condition": "is_closed == 1"
                      },
                      "delete": {
                        "title": "Delete",
                        "className": "btn btn-danger icon-delete notext",
                        "confirm": "You want to delete ?",
                        "condition": "can_manage == 1"
                      }
                    }'>
              <thead>
                <tr>
                  <th data-field="subject" data-sort="subject" data-formatter="formatHelpdeskSubject" data-i18n>{LNG_Ticket}</th>
                  <th data-field="status" data-sort="status" class="right" data-cell-class="top right nowrap"
                      data-formatter="formatHelpdeskStatus" data-i18n>{LNG_Status}</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 Now.js - <a href="https://nowjs.net">nowjs.net</a></p>
  </footer>
</div>
